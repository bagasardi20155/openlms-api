spring.application.name=openlms-api

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/openlms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.application=openlms-api
spring.datasource.driver-class-name=org.postgresql.Driver
server.host=0.0.0.0

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

app.security.jwt.secret=${JWT_SECRET:jwtsecret}
app.security.jwt.issuer=openlms
app.security.jwt.exp-minutes=120
app.security.frontend-callback-url=${FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}